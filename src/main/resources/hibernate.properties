hibernate.connection.driver_class=org.postgresql.Driver
# El esquema se crea con database/fleetroute_pro.sql; Hibernate solo valida que coincida.
# Los catalogos y maestros de ejemplo los inserta config/DatosIniciales al arrancar;
# los usuarios los crea el asistente de primera configuracion o el script SQL.
hibernate.hbm2ddl.auto=validate
hibernate.jdbc.time_zone=America/Managua
hibernate.show_sql=false
hibernate.format_sql=true
