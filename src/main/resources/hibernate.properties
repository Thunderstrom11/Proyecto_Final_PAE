hibernate.connection.driver_class=org.postgresql.Driver
# Hibernate crea las tablas que falten a partir de las entidades (y agrega columnas nuevas).
# Los catalogos y datos de ejemplo los inserta config/DatosIniciales al arrancar.
hibernate.hbm2ddl.auto=update
hibernate.jdbc.time_zone=America/Managua
hibernate.show_sql=false
hibernate.format_sql=true
